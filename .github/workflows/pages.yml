# Build the client and publish it to GitHub Pages on every push to main.
# Pages hosts the static client only; it connects to the public game server in the P2D_SERVER repo variable (see render.yaml).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          P2D_BASE: /Pixel2Dota/
          VITE_P2D_ENDPOINT: ${{ vars.P2D_SERVER }}   # repo variable: the public game server (render.yaml), e.g. pixel2dota-east.onrender.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
