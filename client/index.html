<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel2Dota</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#05070b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel2Dota">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #05070b; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #app .game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #app .hud-root { position: absolute; inset: 0; pointer-events: none; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #8e99b3; font: 14px 'Silkscreen', monospace; }
</style>
</head>
<body>
<div id="app"><div id="boot">Loading...</div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
