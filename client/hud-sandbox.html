<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel2Dota HUD sandbox</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0d14; overflow: hidden; }
  #root { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: radial-gradient(circle at 50% 45%, #1d2a22, #0b100d 70%); }
  #hud { position: absolute; inset: 0; }
  #log { position: fixed; left: 8px; top: 80px; padding: 4px 6px; background: rgba(0,0,0,.6); color: #9fb4e8; font: 10px/1.3 ui-monospace, Consolas, monospace; white-space: pre; pointer-events: none; max-width: 40vw; }
</style>
</head>
<body>
<div id="root"><canvas id="game"></canvas><div id="hud"></div></div>
<div id="log"></div>
<script type="module" src="/src/ui/hud-sandbox.js"></script>
</body>
</html>
